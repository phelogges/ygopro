[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ygopro-agent-server"
version = "0.1.0"
description = "Local Pydantic AI duel agent for YGOPro"
requires-python = ">=3.12"
dependencies = [
    "ygopro-agent-sdk",
    "aiohttp>=3.12,<4",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim[openai]>=2.18,<3",
    "pydantic-ai-harness[codemode]>=0.1,<1",
]

[project.scripts]
agent-server = "agent_server.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13", "pyright>=1.1", "pyinstaller>=6,<7"]

[tool.uv.sources]
ygopro-agent-sdk = { path = "../agent_sdk", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src", "../agent_sdk/src"]
venvPath = "."
venv = ".venv"
