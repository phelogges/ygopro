# 将此模板复制为 config.toml。双 Agent 客户端可分别复制为 host.toml / guest.toml。
# 用 YGOPRO_AGENT_CONFIG=host（或 guest）选择配置档；不同配置档使用不同端口。
# 仅改 backend 即可切换；下面两个后端配置段可同时保留。
# Codex 首次使用需运行 tools/init-codex.py 登录，模型和推理强度
# 在该配置档的 codex_home/config.toml 中自行配置。
backend = "pydantic_ai"

[server]
# 本机 Agent HTTP 监听端口；端口占用直接报错。
port = 8910
# 启动时模型能力探测的最长等待秒数。
startup_timeout_seconds = 60

[backends.pydantic_ai]
# OpenAI Responses 风格端点根地址；密钥不要写在此文件。
base_url = "https://api.openai.com/v1"
# 实际模型名称，启动真实 Agent 前必须填写。
name = "set-model-name"
# 保存 API 密钥的环境变量名。
api_key_env = "YGOPRO_AGENT_API_KEY"
# 上下文窗口大小，用于判断何时压缩历史。
context_window_tokens = 128000
# 是否要求供应商保存会话响应；默认关闭。
store = false
# 供应商是否支持强制工具选择；不支持时设置为 false。
supports_forced_tool_choice = true
# 推理强度：auto 表示不传该参数，由模型决定；none 需模型支持。
reasoning_effort = "auto"
# 请求供应商提供可读推理摘要；off 不请求，auto 由供应商选择粒度。
# reasoning_effort=none 时 auto 的实际请求值为 off。
reasoning_summary = "auto"

[backends.pydantic_ai.compaction]
# Pydantic AI 对话历史达到上下文窗口此比例时压缩。
trigger_fraction = 0.75
# 压缩后的目标比例，必须小于触发比例。
target_fraction = 0.60
# 摘要模型请求的最长秒数。
summary_timeout_seconds = 10

[backends.codex]
# 当前仅支持 ChatGPT 登录；Codex 自己的模型设置保存在 codex_home。
auth = "chatgpt"

[limits]
# 决策总期限、无效意图、宿主工具、客户端查询与批量查卡限额由两端共用。
# 一次游戏提示从接收到决策的最长秒数。
decision_seconds = 60
# 语义动作不合法时最多让模型重试的次数。
invalid_intent_attempts = 3
# 仅 Pydantic AI：一次决策内模型请求上限，包含历史压缩请求。
model_requests = 8
# 一次决策内宿主工具调用上限。
host_tool_attempts = 64
# 保留的 HTTP v3 客户端只读查询协议上限；常规模型工具不发起客户端查询。
client_queries = 4
# cards_by_ids 一次最多查询多少个不同卡片 ID；一次批量调用算一次宿主工具调用。
card_lookup_batch_size = 12
# 仅 Pydantic AI：剩余模型请求数达到此值时移除非最终工具；0 关闭此条件。
finalization_reserve_requests = 2
# 仅 Pydantic AI：剩余秒数达到此值时移除非最终工具；0 关闭此条件。
finalization_reserve_seconds = 20

[storage]
# 两个后端共用的本地状态、轨迹及观测数据目录和保留策略。
# 每个配置档的数据分别保存在此目录的 <配置档名称>/ 下。
directory = ".agents/data"
# 每隔多少次状态操作保存检查点。
checkpoint_interval = 32
# 已确认结束对局的默认保留天数。
retention_days = 30
# 数据库四类记录 payload 的逻辑字节上限；进行中的对局不因超限删除。
max_bytes = 2147483648
