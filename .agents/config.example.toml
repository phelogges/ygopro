# Copy this profile to host.toml / guest.toml when running two Agent clients.
# Select a profile with YGOPRO_AGENT_CONFIG=host (or guest).

[server]
port = 8910
startup_timeout_seconds = 60

[model]
base_url = "https://api.openai.com/v1"
name = "set-model-name"
api_key_env = "YGOPRO_AGENT_API_KEY"
context_window_tokens = 128000
store = false

[limits]
decision_seconds = 60
invalid_intent_attempts = 3
model_requests = 8
host_tool_attempts = 24
client_queries = 4

[compaction]
trigger_fraction = 0.75
target_fraction = 0.60
summary_timeout_seconds = 10

[storage]
directory = ".agents/data"
checkpoint_interval = 32
