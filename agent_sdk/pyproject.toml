[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ygopro-agent-sdk"
version = "0.1.0"
description = "Local decision-contract validation and intent translation for YGOPro"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff", "pyright"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sdk"]
