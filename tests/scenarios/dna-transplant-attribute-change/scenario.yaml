        location: monster
        sequence: 2
  - expect:
      prompt: idle_command
      turn: 2
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: hand
        count: 5
        contains:
        - card_id: "33112041"
        - card_id: "40575313"
          count: 3
        - card_id: "56769674"
      - player: 0
        name: monster
        count: 1
        contains:
        - card_id: "33112041"
          position: face_up_attack
          sequence: 2
          attribute: 64
      - player: 1
        name: monster
        count: 1
        contains:
        - card_id: "40575313"
          position: face_up_attack
          sequence: 3
          attribute: 64
      - player: 1
        name: spell
        count: 1
        contains:
        - card_id: "56769674"
          position: face_up
          sequence: 1
    action:
      kind: choice
      match:
        kind: set_spell_trap
        card_id: "56769674"
        controller: 0
        location: hand
  - expect:
      prompt: select_place
      turn: 2
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: spell
        count: 0
    action:
      kind: select_places
      places:
      - controller: 0
        location: spell
        sequence: 1
  - expect:
      prompt: idle_command
      turn: 2
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: hand
        count: 4
        contains:
        - card_id: "33112041"
        - card_id: "40575313"
          count: 3
      - player: 0
        name: spell
        count: 1
        contains:
        - card_id: "56769674"
          position: face_down
          sequence: 1
