schema_version: 1
decks:
  host: host.ydk
  guest: guest.ydk
pregame:
  host:
  - rock
  guest:
  - scissors
  winner_chooses: go_first
steps:
  host:
  - expect:
      prompt: idle_command
      turn: 1
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: hand
        count: 5
        contains:
        - card_id: "40575313"
          count: 2
    action:
      kind: choice
      match:
        kind: normal_summon
        card_id: "40575313"
        controller: 0
        location: hand
        ordinal: 1
        expected_matches: 2
  - expect:
      prompt: select_place
      turn: 1
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: monster
        count: 0
    action:
      kind: select_places
      places:
      - controller: 0
        location: monster
        sequence: 3
  - expect:
      prompt: idle_command
      turn: 1
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: hand
        count: 4
        contains:
        - card_id: "33112041"
          count: 2
        - card_id: "40575313"
        - card_id: "56769674"
      - player: 0
        name: monster
        count: 1
        contains:
        - card_id: "40575313"
          position: face_up_attack
          sequence: 3
    action:
      kind: choice
      match:
        kind: set_spell_trap
        card_id: "56769674"
        controller: 0
        location: hand
  - expect:
      prompt: select_place
      turn: 1
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: spell
        count: 0
    action:
      kind: select_places
      places:
      - controller: 0
        location: spell
        sequence: 1
  - expect:
      prompt: idle_command
      turn: 1
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: hand
        count: 3
        contains:
        - card_id: "33112041"
          count: 2
        - card_id: "40575313"
      - player: 0
        name: spell
        count: 1
        contains:
        - card_id: "56769674"
          position: face_down
          sequence: 1
    action:
      kind: choice
      match:
        kind: end_turn
  - expect:
      prompt: chain
      turn: 2
      phase: draw
      turn_player: 1
      zones:
      - player: 1
        name: deck
        count: 34
      - player: 1
        name: hand
        count: 6
    action:
      kind: choice
      match:
        kind: pass
  - expect:
      prompt: chain
      turn: 2
      phase: draw
      turn_player: 1
    action:
      kind: choice
      match:
        kind: pass
  - expect:
      prompt: chain
      turn: 2
      phase: standby
      turn_player: 1
    action:
      kind: choice
      match:
        kind: pass
  - expect:
      prompt: chain
      turn: 2
      phase: main_1
      turn_player: 1
      zones:
      - player: 0
        name: monster
        count: 1
        contains:
        - card_id: "40575313"
          sequence: 3
          attribute: 32
      - player: 0
        name: spell
        count: 1
        contains:
        - card_id: "56769674"
          position: face_down
          sequence: 1
      - player: 1
        name: hand
        count: 5
      - player: 1
        name: monster
        count: 1
        contains:
        - card_id: "33112041"
          position: face_up_attack
          sequence: 2
          attribute: 4
    action:
      kind: choice
      match:
        kind: activate
        card_id: "56769674"
        controller: 0
        location: spell
        sequence: 1
  - expect:
      prompt: announce_attribute
      turn: 2
      phase: main_1
      turn_player: 1
      zones:
      - player: 0
        name: spell
        count: 1
        contains:
        - card_id: "56769674"
          position: face_up
          sequence: 1
    action:
      kind: select_cards
      matches:
      - kind: attribute
        bit: 64
    wait_for:
      timeout_ms: 5000
      expect:
        zones:
        - player: 0
          name: monster
          contains:
          - card_id: "40575313"
            sequence: 3
            attribute: 64
        - player: 1
          name: monster
          contains:
          - card_id: "33112041"
            sequence: 2
            attribute: 64
  guest:
  - expect:
      prompt: idle_command
      turn: 2
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: hand
        count: 6
        contains:
        - card_id: "33112041"
          count: 2
    action:
      kind: choice
      match:
        kind: normal_summon
        card_id: "33112041"
        controller: 0
        location: hand
        ordinal: 2
