      turn_player: 1
      zones:
      - player: 0
        name: spell
        count: 1
        contains:
        - card_id: "56769674"
          position: face_up
          sequence: 1
    action:
      kind: select_cards
      matches:
      - kind: attribute
        bit: 8
    wait_for:
      timeout_ms: 5000
      expect:
        zones:
        - player: 0
          name: monster
          contains:
          - card_id: "33112041"
            sequence: 2
            attribute: 8
        - player: 1
          name: monster
          contains:
          - card_id: "40575313"
            sequence: 3
            attribute: 8
