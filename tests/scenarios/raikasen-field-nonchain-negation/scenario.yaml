event_assertions:
  host:
  - kind: effect_activated
    card_id: "35844557"
    controller: self
    location: 4
    sequence: 0
  - kind: chain_link_added
  - kind: chain_link_solving
  - kind: chain_link_disabled
  - kind: chain_link_solved
  - kind: chain_ended
  guest:
  - kind: effect_activated
    card_id: "35844557"
    controller: opponent
    location: 4
    sequence: 0
  - kind: chain_link_added
  - kind: chain_link_solving
  - kind: chain_link_disabled
  - kind: chain_link_solved
  - kind: chain_ended
event_count_assertions:
  host:
  - after:
      kind: effect_activated
      card_id: "35844557"
      controller: self
    until:
      kind: chain_ended
    match:
      kind: chain_link_added
    exactly: 1
  guest:
  - after:
      kind: effect_activated
      card_id: "35844557"
      controller: opponent
    until:
      kind: chain_ended
    match:
      kind: chain_link_added
    exactly: 1
