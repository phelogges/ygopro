schema_version: 1
decks:
  host: host.ydk
  guest: guest.ydk
pregame:
  host:
  - rock
  guest:
  - scissors
  winner_chooses: go_first
steps:
  host:
  - expect:
      prompt: idle_command
      turn: 1
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: hand
        count: 5
        contains:
        - card_id: "72270339"
    action:
      kind: choice
      match:
        kind: special_summon
        card_id: "72270339"
        controller: 0
        location: hand
  - expect:
      prompt: select_unselect_card
      turn: 1
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: hand
        count: 5
        contains:
        - card_id: "33112041"
          count: 3
    action:
      kind: select_step
      match:
        kind: select
        card_id: "33112041"
        controller: 0
        location: hand
        ordinal: 2
        expected_matches: 3
  - expect:
      prompt: select_place
      turn: 1
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: monster
        count: 0
      - player: 0
        name: hand
        count: 4
        contains:
        - card_id: "33112041"
          count: 2
        - card_id: "40575313"
        - card_id: "72270339"
      - player: 0
        name: graveyard
        count: 1
        contains:
        - card_id: "33112041"
    action:
      kind: select_places
      places:
      - controller: 0
        location: monster
        sequence: 2
  - expect:
      prompt: position
      turn: 1
      phase: main_1
      turn_player: 0
    action:
      kind: choice
      match:
        kind: face_up_defense
  - expect:
      prompt: effect_yes_no
      turn: 1
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: monster
        count: 1
        contains:
        - card_id: "72270339"
          position: face_up_defense
          sequence: 2
      - player: 0
        name: hand
        count: 3
        contains:
        - card_id: "33112041"
          count: 2
        - card_id: "40575313"
    action:
      kind: choice
      match:
        kind: accept
        card_id: "72270339"
        description_id: 221
        controller: 0
        location: monster
        sequence: 2
  - expect:
      prompt: select_cards
      turn: 1
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: deck
        count: 35
    action:
      kind: select_cards
      matches:
      - kind: card
        card_id: "89023486"
        controller: 0
        location: deck
  - expect:
      prompt: select_place
      turn: 1
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: spell
        count: 0
    action:
      kind: select_places
      places:
      - controller: 0
        location: spell
        sequence: 3
  - expect:
      prompt: idle_command
      turn: 1
      phase: main_1
      turn_player: 0
      zones:
      - player: 0
        name: deck
        count: 34
      - player: 0
        name: spell
        count: 1
        contains:
        - card_id: "89023486"
          position: face_down
          sequence: 3
    action:
      kind: choice
      match:
        kind: end_turn
  guest: []
goal:
  kind: duel_end
  winner: guest
  expect:
    host:
      turn: 2
      phase: main_1
      turn_player: 1
      life_points:
      - 8000
      - 8000
      zones:
      - player: 0
        name: deck
        count: 34
      - player: 0
        name: hand
        count: 3
        contains:
        - card_id: "33112041"
          count: 2
        - card_id: "40575313"
      - player: 0
        name: monster
        count: 1
        contains:
        - card_id: "72270339"
          position: face_up_defense
          sequence: 2
      - player: 0
        name: spell
        count: 1
        contains:
        - card_id: "89023486"
          position: face_down
          sequence: 3
      - player: 0
        name: graveyard
        count: 1
        contains:
        - card_id: "33112041"
      - player: 1
        name: deck
        count: 34
      - player: 1
        name: hand
        count: 6
    guest:
      turn: 2
      phase: main_1
      turn_player: 0
      life_points:
      - 8000
      - 8000
      zones:
      - player: 0
        name: deck
        count: 34
      - player: 0
        name: hand
        count: 6
        contains:
        - card_id: "33112041"
          count: 3
        - card_id: "40575313"
          count: 3
      - player: 1
        name: deck
        count: 34
      - player: 1
        name: hand
        count: 3
      - player: 1
        name: monster
        count: 1
        contains:
        - card_id: "72270339"
          position: face_up_defense
          sequence: 2
      - player: 1
        name: spell
        count: 1
        contains:
        - position: face_down
          sequence: 3
      - player: 1
        name: graveyard
        count: 1
        contains:
        - card_id: "33112041"
  surrender:
    role: host
    expect:
      host:
        turn: 2
        phase: main_1
        turn_player: 1
      guest: {}
event_assertions:
  host:
  - kind: card_set
    player: self
  - kind: cards_revealed
    cards:
    - {card_id: "89023486", player: self, location: 8, sequence: 3}
  guest:
  - kind: card_set
    player: opponent
  - kind: cards_revealed
    cards:
    - {card_id: "89023486", player: opponent, location: 8, sequence: 3}
