schema_version: 1
decks:
  host: host.ydk
  guest: guest.ydk
defaults:
  optional: decline
allowed_random_events: [hand_shuffle]
pregame:
  host: rock
  guest: scissors
  winner_chooses: go_first
steps:
  host:
    # 速攻魔法「绚岚之献咏」在准备阶段发动。
    - expect:
        prompt: chain
        phase: standby
        zones:
          - player: self
            name: hand
            contains:
              - {card_id: "67115133"}
      action:
        kind: choice
        match: {kind: activate, card_id: "67115133"}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: spell, sequence: 2}
    - expect: {prompt: option}
      action:
        kind: choice
        match: {kind: option, description_id: 1073842130}
    - expect: {prompt: chain}
      action:
        kind: choice
        match: {kind: pass}
    - expect: {prompt: chain}
      action:
        kind: choice
        match: {kind: activate, card_id: "16922142"}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: monster, sequence: 2}
    - expect: {prompt: position}
      action:
        kind: choice
        match: {kind: face_up_defense}
    - expect:
        prompt: effect_yes_no
        zones:
          - player: self
            name: monster
            contains:
              - {card_id: "16922142", sequence: 2}
      action:
        kind: choice
        match: {kind: accept, card_id: "16922142"}
    - expect: {prompt: select_unselect_card}
      action:
        kind: select_step
        match: {kind: select, card_id: "05318639", ordinal: 1, expected_matches: 3}
    - expect: {prompt: select_unselect_card}
      action:
        kind: select_step
        match: {kind: select, card_id: "27755794"}
    # 达维从手牌特殊召唤到主怪兽区 1 号（协议序号 0）。
    - expect:
        prompt: idle_command
        phase: main_1
        zones:
          - player: self
            name: hand
            contains:
              - {card_id: "54143349"}
              - {card_id: "27755794"}
              - {card_id: "05318639"}
      action:
        kind: choice
        match: {kind: special_summon, card_id: "54143349"}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: monster, sequence: 0}
    - expect: {prompt: position}
      action:
        kind: choice
        match: {kind: face_up_defense}
    - expect:
        prompt: effect_yes_no
        zones:
          - player: self
            name: monster
            contains:
              - {card_id: "54143349", sequence: 0}
      action:
        kind: choice
        match: {kind: accept, card_id: "54143349"}
    - expect: {prompt: select_cards}
      action:
        kind: select_cards
        matches:
          - {kind: card, card_id: "53927851", ordinal: 1, expected_matches: 2}
    # 米克拉与风神依次特召到 2、4 号主怪兽区。
    - expect:
        prompt: idle_command
        phase: main_1
        zones:
          - player: self
            name: hand
            contains:
              - {card_id: "27755794"}
              - {card_id: "80538047"}
      action:
        kind: choice
        match: {kind: special_summon, card_id: "27755794"}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: monster, sequence: 1}
    - expect: {prompt: position}
      action:
        kind: choice
        match: {kind: face_up_defense}
    - expect: {prompt: idle_command}
      action:
        kind: choice
        match: {kind: special_summon, card_id: "80538047"}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: monster, sequence: 3}
    - expect: {prompt: position}
      action:
        kind: choice
        match: {kind: face_up_defense}
    - expect:
        prompt: effect_yes_no
        zones:
          - player: self
            name: monster
            contains:
              - {card_id: "80538047", sequence: 3}
      action:
        kind: choice
        match: {kind: accept, card_id: "80538047"}
    - expect: {prompt: select_cards}
      action:
        kind: select_cards
        matches:
          - {kind: card, card_id: "25940932"}
    # 达维与罗莎作连接素材，召唤海灵派比安。
    - expect:
        prompt: idle_command
        zones:
          - player: self
            name: monster
            contains:
              - {card_id: "54143349", sequence: 0}
              - {card_id: "16922142", sequence: 2}
      action:
        kind: choice
        match: {kind: special_summon, card_id: "39341885", location: extra, sequence: 0}
    - expect: {prompt: select_unselect_card}
      action:
        kind: select_step
        match: {kind: select, card_id: "54143349", location: monster, sequence: 0}
    - expect: {prompt: select_unselect_card}
      action:
        kind: select_step
        match: {kind: select, card_id: "16922142", location: monster, sequence: 2}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: monster, sequence: 5}
    - expect:
        prompt: effect_yes_no
        zones:
          - player: self
            name: monster
            contains:
              - {card_id: "39341885", sequence: 5}
      action:
        kind: choice
        match: {kind: accept, card_id: "39341885"}
    - expect: {prompt: select_cards}
      action:
        kind: select_cards
        matches:
          - {kind: card, card_id: "05318639", ordinal: 1, expected_matches: 2}
    # 发动轩昂并准备连锁旋风。
    - expect:
        prompt: idle_command
        zones:
          - player: self
            name: hand
            contains:
              - {card_id: "25940932"}
              - {card_id: "05318639", count: 2}
      action:
        kind: choice
        match: {kind: activate, card_id: "25940932"}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: spell, sequence: 0}
    - expect: {prompt: option}
      action:
        kind: choice
        match: {kind: option, description_id: 415054914}
    - expect: {prompt: chain}
      action:
        kind: choice
        match: {kind: activate, card_id: "05318639", ordinal: 1, expected_matches: 2}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: spell, sequence: 1}
    - expect: {prompt: select_cards}
      action:
        kind: select_cards
        matches:
          - {kind: card, card_id: "25940932", location: spell, sequence: 0}
    # 旋风破坏轩昂后，轩昂从墓地复活达维。
    - expect: {prompt: select_cards}
      action:
        kind: select_cards
        matches:
          - {kind: card, card_id: "54143349", location: graveyard}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: monster, sequence: 0}
    - expect: {prompt: position}
      action:
        kind: choice
        match: {kind: face_up_defense}
    # 复活后按米克拉、轩昂、海灵派比安的顺序组成诱发连锁。
    - expect: {prompt: chain}
      action:
        kind: choice
        match: {kind: activate, card_id: "27755794", location: monster, sequence: 1, ordinal: 1, expected_matches: 2}
    - expect: {prompt: chain}
      action:
        kind: choice
        match: {kind: activate, card_id: "25940932", location: graveyard}
    - expect: {prompt: chain}
      action:
        kind: choice
        match: {kind: activate, card_id: "39341885", location: monster, sequence: 5, ordinal: 1, expected_matches: 2}
    - expect: {prompt: select_cards}
      action:
        kind: select_cards
        matches:
          - {kind: card, card_id: "53813120"}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: spell, sequence: 3}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: spell, sequence: 4}
    - expect: {prompt: select_cards}
      action:
        kind: select_cards
        matches:
          - {kind: card, card_id: "53927851"}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: monster, sequence: 2}
    - expect: {prompt: position}
      action:
        kind: choice
        match: {kind: face_up_defense}
    - expect:
        prompt: chain
        zones:
          - player: self
            name: monster
            contains:
              - {card_id: "53927851", sequence: 2}
          - player: opponent
            name: graveyard
            contains:
              - {card_id: "12375297"}
      action:
        kind: choice
        match: {kind: activate, card_id: "53927851", location: monster, sequence: 2}
    - expect:
        prompt: idle_command
        phase: main_1
        zones:
          - player: opponent
            name: monster
            contains:
              - {card_id: "27204311", sequence: 0}
      action:
        kind: choice
        match: {kind: end_turn}
  guest:
    - expect:
        prompt: chain
        zones:
          - player: self
            name: hand
            contains:
              - {card_id: "14558127"}
      action:
        kind: choice
        match: {kind: activate, card_id: "14558127"}
    # 派比安登场后，蕾吉娜才在 Host 主阶段发动。
    - expect:
        prompt: chain
        phase: main_1
        zones:
          - player: opponent
            name: monster
            contains:
              - {card_id: "53927851", sequence: 2}
          - player: self
            name: hand
            contains:
              - {card_id: "56651978"}
              - {card_id: "12375297"}
      action:
        kind: choice
        match: {kind: activate, card_id: "56651978", location: hand}
    - expect: {prompt: select_cards}
      action:
        kind: select_cards
        matches:
          - {kind: card, card_id: "12375297", location: hand}
    # 蕾吉娜被派比安无效后，发动尼比鲁。
    - expect:
        prompt: chain
        zones:
          - player: self
            name: graveyard
            contains:
              - {card_id: "12375297"}
          - player: opponent
            name: monster
            contains:
              - {card_id: "53927851", sequence: 2}
      action:
        kind: choice
        match: {kind: activate, card_id: "27204311", location: hand}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: monster, sequence: 0}
    - expect: {prompt: position}
      action:
        kind: choice
        match: {kind: face_up_defense}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 1, location: monster, sequence: 2}
    - expect: {prompt: position}
      action:
        kind: choice
        match: {kind: face_up_defense}
    # Guest 第二回合：卢西娜自身特召并检索狱神精。
    - expect:
        prompt: idle_command
        turn: 2
        phase: main_1
        zones:
          - player: self
            name: hand
            contains:
              - {card_id: "13597785"}
      action:
        kind: choice
        match: {kind: special_summon, card_id: "13597785", location: hand}
    - expect: {prompt: position}
      action:
        kind: choice
        match: {kind: face_up_defense}
    - expect:
        prompt: idle_command
        zones:
          - player: self
            name: monster
            contains:
              - {card_id: "13597785", sequence: 2}
      action:
        kind: choice
        match: {kind: activate, card_id: "13597785", location: monster, sequence: 2}
    - expect: {prompt: select_cards}
      action:
        kind: select_cards
        matches:
          - {kind: card, card_id: "12375297", ordinal: 1, expected_matches: 2}
    - expect: {prompt: idle_command}
      action:
        kind: choice
        match: {kind: normal_summon, card_id: "12375297", location: hand}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: monster, sequence: 1}
    - expect: {prompt: idle_command}
      action:
        kind: choice
        match: {kind: activate, card_id: "12375297", location: monster, sequence: 1}
    # 中央怪兽是唯一合法对象，游戏引擎自动指定；效果结算后常规同调召唤。
    - expect:
        prompt: idle_command
        zones:
          - player: self
            name: monster
            contains:
              - {card_id: "13597785", sequence: 2, level: 9}
      action:
        kind: choice
        match: {kind: special_summon, card_id: "84815190", location: extra}
    - expect: {prompt: select_cards}
      action:
        kind: select_cards
        matches:
          - {kind: card, card_id: "12375297", location: monster, sequence: 1}
    - expect: {prompt: sum}
      action:
        kind: select_cards
        matches:
          - {kind: card, card_id: "12375297", location: monster, sequence: 1}
          - {kind: card, card_id: "13597785", location: monster, sequence: 2}
    - expect: {prompt: select_place}
      action:
        kind: select_places
        places:
          - {controller: 0, location: monster, sequence: 5}
    - expect: {prompt: position}
      action:
        kind: choice
        match: {kind: face_up_attack}
    - expect: {prompt: effect_yes_no}
      action:
        kind: choice
        match: {kind: accept, card_id: "12375297"}
    - expect: {prompt: select_cards}
      action:
        kind: select_cards
        matches:
          - {kind: card, card_id: "85976588"}
goal:
  kind: duel_end
  winner: guest
  surrender:
    role: host
    expect:
      host:
        turn: 2
        phase: main_1
        zones:
          - player: self
            name: monster
            exact:
              - {card_id: "27204312", sequence: 2, position: face_up_defense}
          - player: self
            name: spell
            contains:
              - {card_id: "53813120", sequence: 3}
          - player: opponent
            name: monster
            contains:
              - {card_id: "27204311", sequence: 0, position: face_up_defense}
              - {card_id: "84815190", sequence: 5, position: face_up_attack}
      guest:
        turn: 2
        phase: main_1
        zones:
          - player: self
            name: hand
            contains:
              - {card_id: "85976588"}
          - player: self
            name: monster
            contains:
              - {card_id: "27204311", sequence: 0}
              - {card_id: "84815190", sequence: 5}
          - player: self
            name: graveyard
            contains:
              - {card_id: "12375297", count: 2}
              - {card_id: "13597785"}
