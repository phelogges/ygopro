event_assertions:
  host:
  - kind: effect_activated
    card_id: "05318639"
    controller: opponent
    location: 8
  - kind: chain_link_added
  - kind: chain_link_solving
  - kind: chain_link_disabled
  - kind: chain_link_solved
  - kind: chain_ended
  guest:
