    card_id: "05318639"
    controller: self
    location: 8
  - kind: chain_link_added
  - kind: chain_link_solving
  - kind: chain_link_disabled
  - kind: chain_link_solved
  - kind: chain_ended
event_count_assertions:
  host:
  - after:
      kind: effect_activated
      card_id: "05318639"
      controller: opponent
    until:
      kind: chain_ended
    match:
      kind: chain_link_added
    exactly: 1
  - after:
      kind: effect_activated
      card_id: "05318639"
      controller: opponent
    until:
      kind: chain_ended
    match:
      kind: effect_activated
      card_id: "40678060"
      controller: self
    exactly: 0
  guest:
